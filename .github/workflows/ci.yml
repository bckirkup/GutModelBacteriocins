name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libopenmpi-dev openmpi-bin libhdf5-mpi-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGUTIBM_USE_MPI=ON \
            -DGUTIBM_USE_HDF5=ON \
            -DGUTIBM_USE_OPENMP=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Fast unit tests
        run: |
          cd build
          ctest -L unit -LE slow --output-on-failure --parallel $(nproc)

  serial-build:
    name: Serial build (MPI/HDF5 off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake

      - name: Configure
        run: |
          cmake -B build-serial \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra" \
            -DGUTIBM_USE_MPI=OFF \
            -DGUTIBM_USE_HDF5=OFF \
            -DGUTIBM_USE_OPENMP=OFF

      - name: Build
        run: cmake --build build-serial -j$(nproc)

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libopenmpi-dev openmpi-bin libhdf5-mpi-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGUTIBM_USE_MPI=ON \
            -DGUTIBM_USE_HDF5=ON \
            -DGUTIBM_USE_OPENMP=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Integration + slow unit tests
        run: |
          cd build
          ctest -L 'integration|slow|benchmark' -LE gpu --output-on-failure --parallel 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Batch runner smoke
        run: bash scripts/smoke_batch_runner.sh

      - name: Python integration pytest (#155)
        env:
          GUTIBM_BUILD_DIR: ${{ github.workspace }}/build
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          pip install --only-binary=:all: --require-hashes -r .github/requirements-ci.txt
          cd python && pytest tests/ -v -m integration

  openmp-parity:
    name: OpenMP parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libopenmpi-dev openmpi-bin libhdf5-mpi-dev

      - name: Compare serial vs OpenMP fingerprints
        run: bash scripts/compare_openmp_parity.sh

  gpu-parity:
    name: GPU parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake libopenmpi-dev openmpi-bin libhdf5-mpi-dev nvidia-cuda-toolkit

      - name: Compare CPU vs GPU fingerprints
        run: bash scripts/compare_gpu_parity.sh

  cuda-compile:
    name: CUDA compile + GPU tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake libopenmpi-dev openmpi-bin libhdf5-mpi-dev nvidia-cuda-toolkit

      - name: Configure with CUDA
        run: |
          cmake -B build-cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DGUTIBM_USE_MPI=ON \
            -DGUTIBM_USE_HDF5=ON \
            -DGUTIBM_USE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=70

      - name: Build GPU test targets only
        run: |
          cmake --build build-cuda -j$(nproc) \
            --target test_gpu_smoke test_greens_function_gpu test_gpu_diffusion test_gpu_chemical_field test_gpu_feature_combinations test_gpu_production_path test_gpu_reproducibility test_mpi_gpu_multi_rank test_mpi_four_rank test_cuda_aware_mpi_reaction test_gpu_scaling_benchmark test_qssa_gpu_parity test_spatial_hash_gpu_csr test_mechanics_gpu_parity test_gpu_toxin_burst_parity

      - name: GPU tests
        run: cd build-cuda && ctest -L gpu --output-on-failure

  eari-vadi-validation:
    name: EARI/VADI regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libopenmpi-dev openmpi-bin libhdf5-mpi-dev

      - name: EARI/VADI validation regression
        run: bash scripts/validate_eari_vadi.sh

  python-lint:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --only-binary=:all: --require-hashes -r .github/requirements-ci.txt

      - name: Validate config JSON syntax
        run: bash scripts/validate_config_json.sh

      - name: Ruff check
        run: ruff check python/

      - name: Import check
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -c "from gut_ibm_tools import GutIBMData, validation, analysis, fish_observation; print('gut_ibm_tools OK')"
          python -c "from gut_ibm_tools import batch_runner, batch_config, batch_manifest; print('batch_runner OK')"
        working-directory: python

      - name: Batch runner dry-run
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python -m gut_ibm_tools.batch_runner examples/batch_scan/batch.json --dry-run

      - name: Pytest (fast)
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: pytest tests/ -v -m "not integration"
        working-directory: python
